<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenGuard - Perfil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="teste.css" />
</head>
<body>

  <header>
    <figure class="logo-container">
      <img id="logo" src="logo.png" alt="Logo GreenGuard">
    </figure>
    <div class="header-usuario">
      <img id="foto-header" src="foto_perfil.jpeg" alt="Foto do usuário">
      <p>Olá , <strong>Caio <br>Martins !</strong></p>
    </div>
  </header>

  <div class="barra-navegacao">
    <button class="btn-voltar" onclick="history.back()">&#8592;</button>
  </div>

  <div class="pagina-fundo">
    <div class="card-principal">
      <div class="coluna-esquerda">

        <div class="foto-perfil-wrapper">
          <img src="foto_perfil.jpeg" alt="Foto de perfil" class="foto-perfil-img">
          <button class="btn-editar-foto" title="Editar foto">&#9998;</button>
        </div>

        <h2 class="titulo-secao">Dados</h2>

        <div class="bloco-dados">
          <p class="dado-item">Colocação : 203°</p>
          <p class="dado-item">Quantidade de posts feitos : 34 posts</p>
          <p class="dado-item">Total de Check-ins : 9 check-ins</p>
        </div>

        <h2 class="titulo-secao">Missões Diárias</h2>

        <div class="bloco-missoes">
          <div class="missao-item">
            <input type="checkbox" id="missao1" checked>
            <label for="missao1">Curta 3 posts no Fórum</label>
            <span class="pontos">+10<sub>pts</sub></span>
          </div>

          <div class="missao-item">
            <input type="checkbox" id="missao2">
            <label for="missao2">Faça 1 post no Fórum</label>
            <span class="pontos">+6<sub>pts</sub></span>
          </div>

          <div class="missao-item">
            <input type="checkbox" id="missao3">
            <label for="missao3">Faça Check-in em um parque</label>
            <span class="pontos">+20<sub>pts</sub></span>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="missoes.js"></script>
</body>
</html>
