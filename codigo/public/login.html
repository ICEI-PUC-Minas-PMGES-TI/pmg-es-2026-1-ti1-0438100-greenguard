<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GreenGuard</title>
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

    <div class="card">
        <div class="bloco-logo">
            <img src="assets/images/logo.png" alt="GreenGuard">
            <p class="titulo">
                <span class="verde">Green</span><span class="normal">Guard</span>
            </p>
        </div>

        <div class="campo">
            <label>e-mail ou nome de usuário :</label>
            <input type="text" name="usuario">
        </div>

        <div class="campo">
            <label>senha :</label>
            <input type="password" name="senha">
            <a class="link-esqueceu" href="#">Esqueceu sua senha ?</a>
        </div>

        <button class="btn-login">Login</button>

        <p class="rodape">Não possui conta ainda ? <a href="cadastro.html">Crie sua conta</a></p>
    </div>

</body>
</html>
