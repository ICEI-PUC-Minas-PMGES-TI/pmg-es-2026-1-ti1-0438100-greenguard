    <div class="card">
        <div class="bloco-logo">
            <img src="assets/images/logo.png" alt="GreenGuard">
            <p class="titulo">
                <span class="verde">Green</span><span class="normal">Guard</span>
            </p>
        </div>

        <div class="campo">
            <label>e-mail ou nome de usuário :</label>
            <input type="text" id="campo-usuario" name="usuario">
        </div>

        <div class="campo">
            <label>senha :</label>
            <input type="password" id="campo-senha" name="senha">
            <a class="link-esqueceu" href="#">Esqueceu sua senha ?</a>
        </div>

        <p id="msg-login" class="msg-erro"></p>

        <button class="btn-login" onclick="fazerLoginPagina()">Login</button>

        <p class="rodape">Não possui conta ainda ? <a href="cadastro.html">Crie sua conta</a></p>
    </div>

    <script src="assets/js/login-page.js"></script>
