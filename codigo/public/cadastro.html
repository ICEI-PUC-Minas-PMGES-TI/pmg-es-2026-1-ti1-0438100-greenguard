    </div>

    <div class="card">

        <div class="coluna-form">

            <div class="campo">
                <label>Nome Completo</label>
                <input type="text" id="campo-nome" name="nome">
            </div>

            <div class="campo">
                <label>User :</label>
                <input type="text" id="campo-user" name="user">
            </div>

            <div class="campo">
                <label>E-mail :</label>
                <input type="email" id="campo-email" name="email">
            </div>

            <div class="campo">
                <label>CPF :</label>
                <input type="text" id="campo-cpf" name="cpf">
            </div>

            <div class="campo">
                <label>CEP ou Logradouro :</label>
                <div class="campo-wrapper">
                    <input type="text" id="campo-endereco" name="endereco" class="tem-icone">
                    <span class="icone-campo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="campo">
                <label>Senha :</label>
                <div class="campo-wrapper">
                    <input type="password" name="senha" id="campo-senha" class="tem-icone">
                    <button class="icone-campo" type="button" onclick="toggleSenha()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <p id="msg-cadastro" class="msg-erro"></p>

            <button class="btn-cadastrar" type="button" onclick="fazerCadastro()">Cadastrar</button>

            <p class="rodape">Já tenho uma conta ? <a href="login.html">Fazer Login</a></p>

        </div>

        <div class="coluna-logo">
            <img src="assets/images/logo.png" alt="GreenGuard">
            <p class="titulo">
                <span class="verde">Green</span><span class="normal">Guard</span>
            </p>
        </div>

    </div>

    <script src="assets/js/cadastro.js"></script>

</body>
</html>
