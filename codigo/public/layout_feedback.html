<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de Pesquisa de Parques</title>
    <link rel="stylesheet" href="feedback.css">
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div class="logo">logo do sistema</div>
        <div class="header-center">header</div>
        <div class="header-right">
            <div class="profile-pic">foto de perfil</div>
            <div class="settings">configu ração</div>
        </div>
    </header>

    <!-- Banner e Busca -->
    <section class="hero-banner">
        <p>banner de fundo</p>
        
        <div class="search-container">
            <div class="search-bar-row">
                <input type="text" placeholder="barra de pesquisa de parques/lugares seguros">
                <button class="filter-btn">filtro</button>
            </div>
            
            <div class="filters-row">
                <select>
                    <option>turno</option>
                    <option>dia</option>
                    <option>noite</option>
                </select>
                <select>
                    <option>atividade</option>
                    <option>caminhada</option>
                    <option>esporte</option>
                </select>
                <select>
                    <option>distancia</option>
                    <option>até 5km</option>
                    <option>até 10km</option>
                </select>
            </div>
        </div>
    </section>
    </main>

</body>
</html>
