<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tela Genérica</title>
  <link rel="stylesheet" href="./assets/css/modal_crystian.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Poppins:wght@100..900&display=swap"
    rel="stylesheet">
</head>
<body>

  <header>
    <figure><img id="logo" src="./assets/images/logo.png" alt="Logo"></figure>
    <div>
      <figure><img id="foto_perfil" src="./assets/images/foto_perfil.jpeg" alt="Ícone do usuário"></figure>
      <p>Olá , <strong>Caio <br> Martins !</strong></p>
    </div>
  </header>

  <main>
    <section class="hero-section">
      <div class="search-container">
        <div class="input-group-wrapper">
          <input type="text" placeholder="Ex : Parque Municipal Belo Horizonte">
          <div id="filter-panel" class="filter-hidden">

          </div>
        </div>
        <div id="double_btn">
          <button><img src="./assets/images/lupa.png" alt=""></button>
          <button onclick="toggleFilters()"><img src="./assets/images/filtro.png" alt=""></button>
        </div>
      </div>
    </section>
  </main>

  <button class="botao">Criar post</button>
  <div class="posts"></div>


  <div class="modal-overlay" id="modalPost" style="display:none;">
    <div class="post-card-modal">
      <label class="field-label">Descrição do fato ocorrido :</label>
      <textarea class="desc-textarea" id="descricao" placeholder="Descreva o que aconteceu..."></textarea>
      <div class="section-row">
        <div>
          <label class="field-label">Este post é ?</label>
          <div class="category-group" id="catGroup">
            <button class="cat-btn assalto active" data-cat="Assalto">Assalto</button>
            <button class="cat-btn reclamacao " data-cat="Reclamação">Reclamação</button>
            <button class="cat-btn seguranca " data-cat="Segurança">Segurança</button>
          </div>
        </div>
        <div>
          <label class="field-label">Parque do ocorrido :</label>
          <input class="park-input" id="parque" type="text" placeholder="Ex : Parque Ecológico Pampulha">
        </div>
        <div style="align-self:flex-end;">
          <div class="photo-box" id="photoBox">
            <span class="plus-icon">+</span>
            <i class="bi bi-camera"></i>
            <input type="file" accept="image/*" id="photoInput" onchange="previewPhoto(event)">
          </div>
        </div>
      </div>
      <button class="send-btn" onclick="enviar()">Enviar</button>
    </div>
  </div>


  <script src="./modulos/login/login.html"></script>
  <script src="./posts.js"></script>
  <script src="script.js"></script>
</body>
</html>
