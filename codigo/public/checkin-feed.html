<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenGuard - Feed de Check-ins</title>
  <link rel="stylesheet" href="./assets/css/global.css" />
  <link rel="stylesheet" href="./assets/css/checkin.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <a href="index.html">
      <figure><img id="logo" src="./assets/images/logo.png" alt="Logo GreenGuard"></figure>
    </a>
    <div id="header-usuario"></div>
  </header>

  <div id="btn_voltar">
    <a href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="white">
        <path d="M41.4 297.4C28.9 309.9 28.9 330.2 41.4 342.7L169.4 470.7C181.9 483.2 202.2 483.2 214.7 470.7C227.2 458.2 227.2 437.9 214.7 425.4L141.3 352L576 352C593.7 352 608 337.7 608 320C608 302.3 593.7 288 576 288L141.3 288L214.7 214.6C227.2 202.1 227.2 181.8 214.7 169.3C202.2 156.8 181.9 156.8 169.4 169.3L41.4 297.3z"/>
      </svg>
    </a>
  </div>

  <section class="feed-wrapper">
    <div class="feed-header">
      <span class="feed-title">Check-ins recentes</span>
    </div>
    <div class="feed-scroll" id="feed">
      <!-- Preenchido por checkin.js via API -->
    </div>
  </section>

  <script src="./assets/js/login.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!getUsuario()) { window.location.href = 'index.html'; return; }

      fetch('http://localhost:3000/api/checkins')
        .then(r => r.json())
        .then(checkins => {
          const feed = document.getElementById('feed');
          if (!checkins.length) {
            feed.innerHTML = '<p style="color:#d4f5d4;text-align:center;padding:30px">Nenhum check-in ainda.</p>';
            return;
          }
          checkins.slice().reverse().forEach(c => {
            const data = new Date(c.data).toLocaleDateString('pt-BR');
            const card = document.createElement('article');
            card.className = 'checkin-card';
            card.innerHTML = `
              <div class="card-header">
                <div class="avatar">${c.usuario ? c.usuario.slice(0,2).toUpperCase() : '??'}</div>
                <div class="card-meta">
                  <div class="card-location">${c.parque}</div>
                  <div class="card-date">${c.usuario || 'Usuário'} · ${data}</div>
                </div>
                <span class="checkin-badge">Check-in</span>
              </div>`;
            feed.appendChild(card);
          });
        })
        .catch(() => {});
    });
  </script>

</body>
</html>
