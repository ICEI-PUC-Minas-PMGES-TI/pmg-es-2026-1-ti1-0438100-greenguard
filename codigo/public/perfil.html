<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenGuard - Perfil</title>
  <link rel="stylesheet" href="./assets/css/global.css" />
  <link rel="stylesheet" href="./assets/css/modal.css" />
  <link rel="stylesheet" href="./assets/css/perfil.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="./assets/js/checkin.js" defer></script>
</head>

<body>

  <svg class="folha" style="top:120px;left:-20px;width:80px;" viewBox="0 0 100 120" fill="#00C04D">
    <path d="M50 10 C20 30 10 70 50 110 C90 70 80 30 50 10Z"/>
  </svg>
  <svg class="folha" style="top:200px;right:10px;width:60px;" viewBox="0 0 100 120" fill="#00C04D">
    <path d="M50 10 C20 30 10 70 50 110 C90 70 80 30 50 10Z"/>
  </svg>
  <svg class="folha" style="bottom:100px;left:30px;width:70px;" viewBox="0 0 100 120" fill="#00C04D">
    <path d="M50 10 C20 30 10 70 50 110 C90 70 80 30 50 10Z"/>
  </svg>
  <svg class="folha" style="bottom:200px;right:50px;width:90px;" viewBox="0 0 100 120" fill="#00C04D">
    <path d="M50 10 C20 30 10 70 50 110 C90 70 80 30 50 10Z"/>
  </svg>

  <header>
    <a href="index.html">
      <figure><img id="logo" src="./assets/images/logo.png" alt="Logo GreenGuard"></figure>
    </a>
    <div id="header-usuario"></div>
  </header>

  <div id="btn_voltar">
    <a href="index.html">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" fill="white">
        <path d="M41.4 297.4C28.9 309.9 28.9 330.2 41.4 342.7L169.4 470.7C181.9 483.2 202.2 483.2 214.7 470.7C227.2 458.2 227.2 437.9 214.7 425.4L141.3 352L576 352C593.7 352 608 337.7 608 320C608 302.3 593.7 288 576 288L141.3 288L214.7 214.6C227.2 202.1 227.2 181.8 214.7 169.3C202.2 156.8 181.9 156.8 169.4 169.3L41.4 297.3z"/>
      </svg>
    </a>
  </div>

  <div id="perfil-wrapper">

    <aside id="card-esquerdo">

      <div id="foto-perfil-container">
        <img id="foto-usuario" src="./assets/images/user-imagem.png" alt="Foto do usuario">
        <button id="btn-editar-foto" title="Alterar foto" onclick="document.getElementById('foto-file-input').click()">
          <i class="bi bi-pencil-fill"></i>
        </button>
        <input type="file" id="foto-file-input" accept="image/*" style="display:none">
      </div>

      <p id="nome-usuario">Carregando...</p>

      <div id="xp-container">
        <div id="xp-topo">
          <span id="xp-nivel">Nível 1</span>
          <span id="xp-valor">0 XP</span>
        </div>
        <div id="xp-barra-fundo">
          <div id="xp-barra-progresso" style="width:0%"></div>
        </div>
        <div id="xp-legenda">0 / 100 XP para o próximo nível</div>
      </div>

      <div id="box-dados">
        <p>Colocacao : <span id="dado-colocacao">--</span></p>
        <p>Posts feitos : <span id="dado-posts">--</span></p>
        <p>Total de Check-ins : <span id="dado-checkins">--</span></p>
      </div>

      <button id="btn-editar-perfil" onclick="window.location.href='pedro.html'">
        Editar Perfil
      </button>

      <button id="btn-missoes" onclick="abrirModalMissoes()">
        <i class="bi bi-trophy-fill"></i> Ver Missoes
      </button>

    </aside>

    <div id="card-direito">
      <div id="topo-feed">
        <button id="btn-checkin">Fazer Check-in</button>
      </div>
      <div id="feed-checkins">
        <!-- Preenchido dinamicamente por carregarCheckins() -->
      </div>
    </div>

  </div>

  <!-- Modal de Check-in -->
  <div id="modalParque" class="modal-overlay">
    <div class="post-card-modal" style="max-width:460px; position:relative;">

      <button type="button" id="fecharModal" class="checkin-fechar">&times;</button>

      <h2 class="checkin-titulo"><i class="bi bi-geo-alt-fill"></i> Fazer Check-in</h2>

      <form class="form-parque">

        <label class="field-label">Em qual parque você está?</label>
        <div style="position:relative;">
          <input
              type="text"
              id="campoNomeParque"
              class="park-input"
              placeholder="Digite para buscar um parque..."
              autocomplete="off">
          <ul id="parqueListaCheckin" class="parque-lista-checkin"></ul>
        </div>

        <label class="field-label" style="margin-top:16px;">Fotos do parque (opcional)</label>
        <div class="checkin-fotos-area">
          <label class="photo-box">
            <span class="plus-icon">+</span>
            <input type="file" id="checkinFotos" accept="image/*" multiple>
          </label>
          <div id="checkinPreview" class="checkin-preview"></div>
        </div>

        <div id="checkinLocBox" class="checkin-loc-box checkin-loc-idle">
          <div id="checkinLocStatus" class="checkin-loc-status">
            <i class="bi bi-geo-alt"></i>
            <span>Selecione um parque para verificar sua localização.</span>
          </div>
          <button type="button" id="btnVerificarLoc" class="checkin-loc-btn">Verificar localização</button>
        </div>

        <button type="submit" class="send-btn" id="btnEnviar" disabled>Fazer Check-in</button>

      </form>

    </div>
  </div>

  <!-- Modal de missoes semanais -->
  <div id="modal-missoes-overlay" onclick="fecharModalOverlay(event)">
    <div id="modal-missoes">
      <div id="modal-header">
        <div id="modal-header-top">
          <h2><i class="bi bi-trophy-fill"></i> Missoes</h2>
          <button id="btn-fechar-modal" onclick="fecharModal()" title="Fechar">x</button>
        </div>
        <div id="modal-abas">
          <button class="modal-aba ativa" onclick="trocarAba('semanal', this)">Semanais</button>
          <button class="modal-aba" onclick="trocarAba('historico', this)">Historico</button>
        </div>
      </div>
      <div id="modal-corpo">
        <div id="painel-semanal" class="painel-aba ativo"></div>
        <div id="painel-historico" class="painel-aba"></div>
      </div>
    </div>
  </div>

  <script src="./assets/js/login.js"></script>
  <script src="./assets/js/missoes-core.js"></script>
  <script src="./assets/js/missoes.js"></script>
  <script>
    const usuario = getUsuario();
    if (!usuario) { window.location.href = 'index.html'; }

    // ── Barra de XP (fonte: banco + tabela de níveis de /niveis) ──
    async function atualizarBarraXP() {
      try {
        const [rUser, niveis] = await Promise.all([
          fetch('http://localhost:3000/api/usuarios/' + usuario.id).then(r => r.json()),
          getNiveis()
        ]);
        const xp = rUser.xp || 0;
        const info = calcNivel(xp, niveis);

        document.getElementById('xp-nivel').textContent = `Nível ${info.nivel}`;
        document.getElementById('xp-valor').textContent = `${xp} XP`;
        document.getElementById('xp-barra-progresso').style.width = `${info.pct}%`;
        document.getElementById('xp-legenda').textContent = info.max
          ? 'Nível máximo atingido!'
          : `${info.xpNoNivel} / ${info.xpNecessario} XP para o próximo nível`;

        // Mantém a sessão espelhando o banco
        usuario.xp = xp; usuario.nivel = info.nivel; salvarSessao(usuario);
      } catch (e) { console.error('Erro na barra de XP:', e); }
    }

    // ── Feed de check-ins do usuário (global p/ ser chamado após novo check-in) ──
    function carregarCheckins() {
      fetch('http://localhost:3000/api/checkins?usuario_id=' + usuario.id)
        .then(r => r.json())
        .then(checkins => {
          const feed = document.getElementById('feed-checkins');
          document.getElementById('dado-checkins').textContent = checkins.length;
          if (!checkins.length) {
            feed.innerHTML = '<p style="color:#555;text-align:center;padding:20px">Nenhum check-in ainda. Explore um parque!</p>';
            return;
          }
          feed.innerHTML = '';
          checkins.slice().reverse().forEach(c => {
            const card = document.createElement('div');
            card.className = 'checkin-card';
            const data = new Date(c.data).toLocaleDateString('pt-BR');

            const fotos = (c.imagens && c.imagens.length)
              ? c.imagens
              : (c.imagem ? [c.imagem] : []);
            const fotosHTML = fotos.length
              ? '<div class="checkin-card-fotos">' +
                  fotos.map(src => '<img src="' + src + '" alt="Foto do check-in">').join('') +
                '</div>'
              : '';

            card.innerHTML =
              '<p class="checkin-local">Estive no <span>' + c.parque + '</span> em ' + data + '!</p>' +
              fotosHTML;
            feed.appendChild(card);
          });
        })
        .catch(() => {});
    }

    // ── Estatísticas (posts, colocação no ranking) ──
    function carregarDados() {
      fetch('http://localhost:3000/api/posts?autor_id=' + usuario.id)
        .then(r => r.json())
        .then(posts => { document.getElementById('dado-posts').textContent = posts.length; })
        .catch(() => {});

      fetch('http://localhost:3000/api/usuarios')
        .then(r => r.json())
        .then(usuarios => {
          const ordenados = [...usuarios].sort((a, b) => (b.xp || 0) - (a.xp || 0));
          const pos = ordenados.findIndex(u => u.id === usuario.id) + 1;
          document.getElementById('dado-colocacao').textContent = pos ? `${pos}º` : '--';
        })
        .catch(() => {});
    }

    document.addEventListener('DOMContentLoaded', () => {
      const foto = document.getElementById('foto-usuario');
      foto.src = usuario.foto_perfil || './assets/images/user-imagem.png';
      foto.onerror = () => { foto.src = './assets/images/user-imagem.png'; };
      document.getElementById('nome-usuario').textContent = usuario.nome;

      atualizarBarraXP();
      carregarCheckins();
      carregarDados();

      // Atualiza a barra e a colocação quando uma missão credita XP
      window.addEventListener('xp-atualizado', () => { atualizarBarraXP(); carregarDados(); });

      document.getElementById('foto-file-input').addEventListener('change', async function () {
        const file = this.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('foto', file);

        try {
          const uploadRes = await fetch('http://localhost:3000/upload-perfil', { method: 'POST', body: formData });
          if (!uploadRes.ok) throw new Error();
          const { caminho } = await uploadRes.json();

          await fetch('http://localhost:3000/api/usuarios/' + usuario.id, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ foto_perfil: caminho })
          });

          usuario.foto_perfil = caminho;
          salvarSessao(usuario);
          foto.src = caminho;
          renderizarHeader();
        } catch {
          alert('Erro ao atualizar foto. Verifique se o servidor está rodando.');
        }
      });
    });
  </script>

</body>
</html>
