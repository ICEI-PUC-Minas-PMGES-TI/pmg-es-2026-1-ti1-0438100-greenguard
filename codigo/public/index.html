<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenGuard - Home</title>
  <link rel="stylesheet" href="./assets/css/global.css" />
  <link rel="stylesheet" href="./assets/css/home.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

  <header>
    <a href="index.html">
      <figure><img id="logo" src="./assets/images/logo.png" alt="Logo GreenGuard"></figure>
    </a>
    <nav id="nav-principal">
      <a href="index.html" class="ativo">Home</a>
      <a href="parques.html">Parques</a>
      <a href="forum.html">Fórum</a>
      <a href="ranking.html">Ranking</a>
    </nav>
    <div id="header-usuario"></div>
  </header>

  <main>

    <section class="hero-section">
      <div class="search-container">
        <div class="input-group-wrapper">
          <input id="buscaIndex" type="text" placeholder="Ex : Parque Municipal Belo Horizonte"
                 onkeydown="if(event.key==='Enter') buscarParques()">
          <div id="filter-panel" class="filter-hidden">
            <div class="filter-group" data-filtro="atividade">
              <div class="filter-header" onclick="toggleDropdown(this)">
                <span>Atividade</span><i class="bi bi-caret-down-fill"></i>
              </div>
              <ul class="filter-options dropdown-closed">
                <li data-val="caminhada" onclick="selectOption(this)">Caminhada / trilha</li>
                <li data-val="esporte" onclick="selectOption(this)">Esporte / quadras</li>
              </ul>
            </div>
            <div class="filter-group" data-filtro="distancia">
              <div class="filter-header" onclick="toggleDropdown(this)">
                <span>Distância</span><i class="bi bi-caret-down-fill"></i>
              </div>
              <ul class="filter-options dropdown-closed">
                <li data-val="5" onclick="selectOption(this)">Até 5km</li>
                <li data-val="10" onclick="selectOption(this)">Até 10km</li>
              </ul>
            </div>
          </div>
        </div>
        <div id="double_btn">
          <button onclick="buscarParques()"><img src="./assets/images/lupa.png" alt="Buscar"></button>
          <button onclick="toggleFilters()"><img src="./assets/images/filtro.png" alt="Filtros"></button>
        </div>
      </div>
    </section>

    <div id="content">

      <a href="forum.html">
        <section id="sec-forum">
          <h2>Forum de Denuncia</h2>
          <div class="forum_denuncia">
            <button>Ir para o Forum !</button>
          </div>
        </section>
      </a>

      <section id="map-section">
        <div id="map"></div>
      </section>

      <section id="right-side">
        <div class="box-side">
          <div class="box-side-head">
            <h2>Recomendacoes</h2>
            <a class="ver-todos" href="parques.html">Ver todos</a>
          </div>
          <div class="side-card scroll-card" id="recomendacoes-card">
            <!-- Preenchido dinamicamente por home.js -->
          </div>
        </div>

        <div class="box-side">
          <h2>Favoritos</h2>
          <div class="side-card scroll-card" id="favoritos-card">
            <!-- Preenchido dinamicamente por home.js -->
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="./assets/js/login.js"></script>
  <script src="./assets/js/home.js"></script>

</body>
</html>
