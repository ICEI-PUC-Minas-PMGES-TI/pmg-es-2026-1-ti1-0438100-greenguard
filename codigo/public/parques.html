<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenGuard - Parques Recomendados</title>
  <link rel="stylesheet" href="./assets/css/global.css" />
  <link rel="stylesheet" href="./assets/css/modal.css" />
  <link rel="stylesheet" href="./assets/css/parques.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <a href="index.html">
      <figure><img id="logo" src="./assets/images/logo.png" alt="Logo GreenGuard"></figure>
    </a>
    <nav id="nav-principal">
      <a href="index.html">Home</a>
      <a href="parques.html" class="ativo">Parques</a>
      <a href="forum.html">Fórum</a>
      <a href="ranking.html">Ranking</a>
    </nav>
    <div id="header-usuario"></div>
  </header>

  <main>
    <section class="hero-section">
      <div class="search-container">
        <div class="input-group-wrapper">
          <input type="text" placeholder="Ex : Parque Municipal Belo Horizonte">
          <div id="filter-panel" class="filter-hidden">
            <div class="filter-group" data-filtro="atividade">
              <div class="filter-header" onclick="toggleDropdown(this)">
                <span>Atividade</span><i class="bi bi-caret-down-fill"></i>
              </div>
              <ul class="filter-options dropdown-closed">
                <li data-val="caminhada" onclick="selectOption(this)">Caminhada / trilha</li>
                <li data-val="esporte" onclick="selectOption(this)">Esporte / quadras</li>
              </ul>
            </div>
            <div class="filter-group" data-filtro="distancia">
              <div class="filter-header" onclick="toggleDropdown(this)">
                <span>Distância</span><i class="bi bi-caret-down-fill"></i>
              </div>
              <ul class="filter-options dropdown-closed">
                <li data-val="5" onclick="selectOption(this)">Até 5km</li>
                <li data-val="10" onclick="selectOption(this)">Até 10km</li>
              </ul>
            </div>
          </div>
        </div>
        <div id="double_btn">
          <button><img src="./assets/images/lupa.png" alt="Buscar"></button>
          <button onclick="toggleFilters()"><img src="./assets/images/filtro.png" alt="Filtros"></button>
        </div>
      </div>
    </section>

    <section class="cards-section">
      <!-- Cards renderizados dinamicamente por parques.js -->
    </section>
  </main>

  <!-- Modal: Avaliar parque (estrelas + comentário) -->
  <div id="modalAvaliar" class="modal-overlay">
    <div class="post-card-modal" style="max-width:460px; position:relative;">
      <button type="button" class="modal-x" id="fecharAvaliar">&times;</button>
      <h2 class="modal-titulo"><i class="bi bi-star-fill"></i> Avaliar parque</h2>
      <p id="avaliarNomeParque" class="modal-subtitulo"></p>

      <label class="field-label">Sua nota</label>
      <div id="estrelasAvaliar" class="estrelas-modal">
        <i class="bi bi-star" data-nota="1"></i>
        <i class="bi bi-star" data-nota="2"></i>
        <i class="bi bi-star" data-nota="3"></i>
        <i class="bi bi-star" data-nota="4"></i>
        <i class="bi bi-star" data-nota="5"></i>
      </div>

      <label class="field-label" style="margin-top:16px;">Comentário (opcional)</label>
      <textarea id="comentarioAvaliar" class="desc-textarea" placeholder="Conte como foi sua experiência neste parque..." maxlength="300"></textarea>

      <button class="send-btn" id="enviarAvaliacao">Enviar avaliação</button>
    </div>
  </div>

  <!-- Modal: Ver avaliações do parque -->
  <div id="modalAvaliacoes" class="modal-overlay">
    <div class="post-card-modal" style="max-width:480px; position:relative;">
      <button type="button" class="modal-x" id="fecharAvaliacoes">&times;</button>
      <h2 class="modal-titulo"><i class="bi bi-chat-square-text"></i> Avaliações</h2>
      <p id="avaliacoesNomeParque" class="modal-subtitulo"></p>
      <div id="listaAvaliacoes" class="lista-avaliacoes"></div>
    </div>
  </div>

  <script src="./assets/js/login.js"></script>
  <script src="./assets/js/missoes-core.js"></script>
  <script src="./assets/js/parques.js"></script>

</body>
</html>
